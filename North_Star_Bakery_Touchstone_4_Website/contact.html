<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery | Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <img class="logo" src="bakery-logo_c.png" alt="North Star Bakery logo">
    <h1>North Star Bakery</h1>
    <p>Fresh baked goods made every day.</p>
</header>
<nav aria-label="Main navigation">
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
    </ul>
</nav>
<main>
    <section class="content-row">
        <div>
            <h2>Contact Us</h2>
            <p>Use this form for questions about products, custom cakes, or general feedback.</p>
        </div>
        <form id="contact-form" action="#" method="post" novalidate>
            <fieldset>
                <legend>Contact Information</legend>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required minlength="2" aria-describedby="name-error">
                <span class="error-message" id="name-error"></span>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required aria-describedby="email-error">
                <span class="error-message" id="email-error"></span>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone"
                       pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                       placeholder="555-555-5555">
                <span class="error-message" id="phone-error"></span>

                <label for="reason">Reason for Contact:</label>
                <select id="reason" name="reason" required aria-describedby="reason-error">
                    <option value="">Choose one</option>
                    <option value="question">General Question</option>
                    <option value="cake">Custom Cake</option>
                    <option value="feedback">Feedback</option>
                </select>
                <span class="error-message" id="reason-error"></span>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required minlength="10" aria-describedby="message-error"></textarea>
                <span class="error-message" id="message-error"></span>

                <button type="submit">Send</button>
                <p id="form-success" class="success-message" aria-live="polite"></p>
            </fieldset>
        </form>
    </section>
</main>
<footer>
    <p>&copy; 2026 North Star Bakery</p>
</footer>
    <script src="script.js"></script>
</body>
</html>
